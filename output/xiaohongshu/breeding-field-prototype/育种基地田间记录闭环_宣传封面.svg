<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#082719"/>
      <stop offset="48%" stop-color="#0f5f3b"/>
      <stop offset="100%" stop-color="#efe6cf"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#edf7e8" stop-opacity="0.92"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#000000" flood-opacity="0.26"/>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1"/>
    </pattern>
    <style>
      .cn { font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", Arial, sans-serif; }
      .title { font-size: 82px; font-weight: 900; letter-spacing: -2px; fill: #ffffff; }
      .subtitle { font-size: 42px; font-weight: 900; fill: #fef3c7; }
      .small { font-size: 25px; font-weight: 800; fill: #dff8e6; }
      .dark { fill: #16351f; }
      .muted { fill: #65715f; }
      .green { fill: #166534; }
      .label { font-size: 23px; font-weight: 900; }
      .mini { font-size: 19px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1080" height="1440" fill="url(#bg)"/>
  <rect width="1080" height="980" fill="url(#grid)" opacity="0.9"/>
  <circle cx="180" cy="120" r="260" fill="#4ade80" opacity="0.16"/>
  <circle cx="930" cy="110" r="240" fill="#f59e0b" opacity="0.15"/>

  <g class="cn">
    <rect x="76" y="78" width="246" height="56" rx="28" fill="#ffffff" opacity="0.13" stroke="#ffffff" stroke-opacity="0.24"/>
    <text x="100" y="115" class="small">FDE 农业小原型</text>

    <text x="76" y="235" class="title">育种基地</text>
    <text x="76" y="335" class="title">田间记录闭环</text>

    <rect x="76" y="385" width="404" height="78" rx="28" fill="#ffffff" opacity="0.14"/>
    <text x="105" y="438" class="subtitle">录入 → 日志 → 看板</text>
  </g>

  <!-- experimental field plots -->
  <g transform="translate(-60 1040) skewY(-8)" opacity="0.95">
    <rect x="0" y="0" width="1260" height="350" rx="30" fill="#d6c39a"/>
    <g stroke="#ffffff" stroke-opacity="0.42" stroke-width="5">
      <rect x="90" y="35" width="255" height="120" rx="18" fill="#7fb05a"/>
      <rect x="380" y="32" width="265" height="125" rx="18" fill="#5f933f"/>
      <rect x="680" y="36" width="285" height="120" rx="18" fill="#8fbc62"/>
      <rect x="1000" y="34" width="230" height="122" rx="18" fill="#639746"/>
      <rect x="180" y="190" width="310" height="125" rx="18" fill="#608d3d"/>
      <rect x="530" y="190" width="330" height="126" rx="18" fill="#80ad55"/>
      <rect x="900" y="190" width="300" height="126" rx="18" fill="#557f39"/>
    </g>
  </g>

  <!-- phone -->
  <g transform="translate(95 540) rotate(-4)" filter="url(#shadow)">
    <rect x="0" y="0" width="365" height="590" rx="56" fill="#ffffff" opacity="0.96"/>
    <rect x="20" y="22" width="325" height="546" rx="42" fill="#0b1f16"/>
    <rect x="126" y="40" width="112" height="20" rx="10" fill="#06140e"/>
    <text x="48" y="104" class="cn label" fill="#dcfce7">田间操作录入</text>

    <rect x="44" y="130" width="276" height="145" rx="26" fill="#f8fff2"/>
    <text x="66" y="172" class="cn label green">品种 / 播期 / 小区</text>
    <rect x="66" y="196" width="216" height="17" rx="8" fill="#dcebd5"/>
    <rect x="66" y="226" width="148" height="17" rx="8" fill="#dcebd5"/>

    <rect x="44" y="296" width="276" height="170" rx="26" fill="#f8fff2"/>
    <text x="66" y="338" class="cn label green">一级操作类型</text>
    <rect x="66" y="360" width="72" height="36" rx="18" fill="#dcfce7"/>
    <text x="83" y="385" class="cn mini green">植保</text>
    <rect x="150" y="360" width="72" height="36" rx="18" fill="#dcfce7"/>
    <text x="167" y="385" class="cn mini green">晒田</text>
    <rect x="234" y="360" width="72" height="36" rx="18" fill="#dcfce7"/>
    <text x="251" y="385" class="cn mini green">灌溉</text>
    <rect x="66" y="412" width="188" height="34" rx="17" fill="#fef3c7"/>
    <text x="82" y="435" class="cn mini" fill="#7c4a13">当前生育期：抽穗</text>

    <rect x="60" y="492" width="244" height="48" rx="20" fill="#16a34a"/>
    <text x="128" y="524" class="cn label" fill="#ffffff">提交记录</text>
  </g>

  <!-- dashboards -->
  <g transform="translate(505 575)" filter="url(#shadow)">
    <rect x="0" y="0" width="495" height="210" rx="34" fill="url(#card)"/>
    <text x="32" y="56" class="cn label green">农事操作日志</text>
    <g transform="translate(32 88)">
      <rect x="0" y="0" width="125" height="84" rx="22" fill="#edf7e8"/>
      <text x="42" y="42" class="cn" font-size="34" font-weight="900" fill="#166534">12</text>
      <text x="36" y="68" class="cn mini muted">记录</text>
      <rect x="148" y="0" width="125" height="84" rx="22" fill="#edf7e8"/>
      <text x="198" y="42" class="cn" font-size="34" font-weight="900" fill="#166534">4</text>
      <text x="186" y="68" class="cn mini muted">小区</text>
      <rect x="296" y="0" width="125" height="84" rx="22" fill="#edf7e8"/>
      <text x="346" y="42" class="cn" font-size="34" font-weight="900" fill="#166534">3</text>
      <text x="326" y="68" class="cn mini muted">生育期</text>
    </g>
  </g>

  <g transform="translate(505 820)" filter="url(#shadow)">
    <rect x="0" y="0" width="495" height="255" rx="34" fill="url(#card)"/>
    <text x="32" y="56" class="cn label green">材料 × 播期 × 小区看板</text>
    <g class="cn mini dark" font-weight="900">
      <rect x="32" y="86" width="132" height="48" rx="16" fill="#f2f7ed"/>
      <text x="50" y="118">稻花香A</text>
      <rect x="178" y="86" width="132" height="48" rx="16" fill="#f2f7ed"/>
      <text x="195" y="118">第一播期</text>
      <rect x="324" y="86" width="132" height="48" rx="16" fill="#f2f7ed"/>
      <text x="363" y="118">A-01</text>

      <rect x="32" y="152" width="132" height="48" rx="16" fill="#f2f7ed"/>
      <text x="47" y="184">新品系01</text>
      <rect x="178" y="152" width="132" height="48" rx="16" fill="#f2f7ed"/>
      <text x="195" y="184">第二播期</text>
      <rect x="324" y="152" width="132" height="48" rx="16" fill="#f2f7ed"/>
      <text x="363" y="184">B-03</text>
    </g>
  </g>

  <g class="cn">
    <rect x="76" y="1320" width="470" height="58" rx="29" fill="#ffffff" opacity="0.72"/>
    <text x="103" y="1358" font-size="25" font-weight="900" fill="#14532d">田间数据 · 本地闭环 · 试用原型</text>
    <rect x="695" y="1320" width="309" height="58" rx="29" fill="#ffffff" opacity="0.72"/>
    <text x="724" y="1358" font-size="25" font-weight="900" fill="#14532d">Smart Breeding Notes</text>
  </g>
</svg>
